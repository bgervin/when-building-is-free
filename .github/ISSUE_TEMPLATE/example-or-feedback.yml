name: Example or field report
description: Share a spec format we don't cover, a case the charter didn't fit, or a validator bug. For keep or kill stories, use the Charter story form.
labels: ["feedback"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: What are you sharing?
      options:
        - A spec format that needs a before and after example
        - A case the charter didn't fit
        - A validator bug
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Remove anything confidential. Fictional examples are fine.
    validations:
      required: true
